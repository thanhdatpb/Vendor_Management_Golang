version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: hub_vendor_mysql
    restart: always
    environment:
      MYSQL_DATABASE: hub_vendor_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
      MYSQL_USER: user
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
