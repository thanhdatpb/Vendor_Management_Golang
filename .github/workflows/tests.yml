# ════════════════════════════════════════════════════════════════
#  Bộ test tự động — cổng chặn trước khi lên production
#
#  Nguyên tắc (docs/TESTING.md):
#    • Job "…-tests"   = CHẶN MERGE. Chỉ chứa test mô tả hành vi đang có +
#      lưới an toàn hồi quy (golden test). Đỏ = có thứ vừa bị làm hỏng.
#    • Job "…-pending" = THÔNG TIN. Chứa test viết cho mục tiêu CHƯA làm
#      (mindmap feedback). Test đỏ ở đây là ĐÚNG; nó là danh sách việc còn lại,
#      xanh dần theo từng PR. Bản thân JOB luôn xanh — kết quả nằm ở phần
#      Summary của run, không phải ở dấu X trên PR. Cố ý như vậy: một check
#      lúc nào cũng đỏ sẽ làm người ta quen mắt và bỏ qua cả lúc bộ chặn merge
#      đỏ thật. Khi một mục xong, chuyển test sang bộ chặn:
#        - frontend: bỏ hậu tố `.pending` trong tên file
#        - backend : bỏ #[Group('pending')] trên class
# ════════════════════════════════════════════════════════════════
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend-tests:
    name: Frontend — bộ chặn merge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 đòi Node ^22.22.2 || ^24.15.0 || >=26.0.0. Node 20 làm
          # undici thiếu `webidl.util.markAsUncloneable` → toàn bộ test jsdom
          # nổ ở tầng import, không phải lỗi của test.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Chạy test (fail thì chặn merge)
        run: npm test

  frontend-pending:
    name: Frontend — mục tiêu chưa đạt (thông tin)
    runs-on: ubuntu-latest
    # `continue-on-error` đặt ở STEP chứ không phải ở job: để ở job thì GitHub
    # vẫn kết luận job là failure và PR hiện dấu X đỏ — trái với ý "THÔNG TIN"
    # ghi ở đầu file. Một check LÚC NÀO CŨNG đỏ sẽ dạy người ta bỏ qua màu đỏ,
    # và khi bộ chặn merge đỏ thật thì không ai buồn nhìn nữa.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 đòi Node ^22.22.2 || ^24.15.0 || >=26.0.0. Node 20 làm
          # undici thiếu `webidl.util.markAsUncloneable` → toàn bộ test jsdom
          # nổ ở tầng import, không phải lỗi của test.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Mục tiêu trong mindmap chưa có code
        id: pending
        continue-on-error: true
        run: npm run test:pending
      - name: Ghi kết quả ra summary
        if: always()
        run: |
          echo "### Frontend — mục tiêu chưa đạt: \`${{ steps.pending.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`failure\` ở đây là ĐÚNG — đây là danh sách việc còn lại, xanh dần theo từng PR." >> "$GITHUB_STEP_SUMMARY"
          echo "Chi tiết xem log bước trên. Khi một mục xong: bỏ hậu tố \`.pending\` trong tên file test." >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Bundle đã build — không trắng trang, có cấu hình realtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # jsdom 30 đòi Node ^22.22.2 || ^24.15.0 || >=26.0.0. Node 20 làm
          # undici thiếu `webidl.util.markAsUncloneable` → toàn bộ test jsdom
          # nổ ở tầng import, không phải lỗi của test.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # KHÔNG build lại ở đây. Production serve thẳng frontend/dist ĐÃ COMMIT
      # (CLAUDE.md §7), nên thứ cần kiểm là chính bundle đó — build lại rồi kiểm
      # bản build lại thì không nói lên được điều gì về thứ sẽ chạy thật.
      # Cả hai script dưới đây đều tự nói rõ mục tiêu là bundle đã commit.
      # Việc "source có build được không" đã có job frontend-build-check lo.
      - name: Bundle phải có cấu hình realtime (PR-R3a)
        run: npm run check:realtime
      - name: Smoke — #root có render, không exception
        run: npm run test:smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome

  backend-tests:
    name: Backend — bộ chặn merge
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:c2VjdXJlLXRlc3Qta2V5LWZvci1jaS0zMmJ5dGVzISE=
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, zip
          coverage: none
      - name: Kiểm tính hợp lệ của composer (PR-M1)
        run: |
          composer validate --strict --no-check-publish
          composer install --dry-run 2>&1 | tee /tmp/composer-dry.txt
          if grep -qiE '^\s*- Removing' /tmp/composer-dry.txt; then
            echo "::error::composer install sẽ GỠ package đang có trong vendor/ — lock lệch json. Xem PR-M1."
            exit 1
          fi
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Chạy test (bỏ nhóm pending)
        run: php artisan test --exclude-group=pending

  backend-mysql:
    name: Backend — trên MySQL thật (bộ chặn merge)
    # Bộ test mặc định chạy SQLite. SQLite chỉ có "type affinity": nó nhận mọi
    # chuỗi vào cột datetime và bỏ qua độ chính xác của decimal. Nghĩa là cả một
    # LỚP lỗi chỉ lộ trên production:
    #   • chuỗi ISO-8601 kèm hậu tố `Z` ghi vào cột timestamp → MySQL strict ném
    #     1292 Incorrect datetime value
    #   • giá trị vượt tầm decimal → 1264 Out of range
    # Job này là nơi duy nhất bắt được chúng trước khi lên production.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:c2VjdXJlLXRlc3Qta2V5LWZvci1jaS0zMmJ5dGVzISE=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hcvh_test
      DB_USERNAME: root
      DB_PASSWORD: secret
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: hcvh_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Chạy test trên MySQL (bỏ nhóm pending)
        # phpunit.xml khai DB_CONNECTION=sqlite nhưng không đặt force="true",
        # nên biến môi trường ở trên thắng.
        run: php artisan test --exclude-group=pending

  backend-pending:
    name: Backend — mục tiêu chưa đạt (thông tin)
    runs-on: ubuntu-latest
    # `continue-on-error` đặt ở STEP chứ không phải ở job: để ở job thì GitHub
    # vẫn kết luận job là failure và PR hiện dấu X đỏ — trái với ý "THÔNG TIN"
    # ghi ở đầu file. Một check LÚC NÀO CŨNG đỏ sẽ dạy người ta bỏ qua màu đỏ,
    # và khi bộ chặn merge đỏ thật thì không ai buồn nhìn nữa.
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:c2VjdXJlLXRlc3Qta2V5LWZvci1jaS0zMmJ5dGVzISE=
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sqlite3, pdo_sqlite, mbstring, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Lỗ hổng phân quyền & nợ kỹ thuật chưa vá
        id: pending
        continue-on-error: true
        run: php artisan test --group=pending
      - name: Ghi kết quả ra summary
        if: always()
        run: |
          echo "### Backend — mục tiêu chưa đạt: \`${{ steps.pending.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`failure\` ở đây là ĐÚNG — đây là danh sách việc còn lại, xanh dần theo từng PR." >> "$GITHUB_STEP_SUMMARY"
          echo "Chi tiết xem log bước trên. Khi một mục xong: bỏ \`#[Group('pending')]\` trên class test." >> "$GITHUB_STEP_SUMMARY"
